# Optional: push this folder to a GitHub repo and the .exe is built for you
# (Actions tab → latest run → Artifacts → ProfileRefresher).
name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish ProfileRefresher.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=none -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: ProfileRefresher
          path: publish/ProfileRefresher.exe
